<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products by category | Online Store</title>
  <link rel="stylesheet" href="/css/products.css">
  <script type="module" src="/js/products.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to products</a>
  <header class="site-header">
    <a class="logo" href="/">Online Store</a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/products.html" aria-current="page">Products</a>
    </nav>
  </header>
  <main id="main">
    <h1>Shop by category</h1>
    <p class="intro">Explore our phones and tablets. Prices are in Turkish lira.</p>
    <nav id="category-nav" class="category-nav" aria-label="Product categories" hidden></nav>
    <p id="catalog-status" role="status" aria-live="polite">Loading products…</p>
    <button id="retry" type="button" hidden>Try again</button>
    <div id="catalog" aria-busy="true"></div>
    <noscript><p>Enable JavaScript to load the product catalog.</p></noscript>
  </main>
  <footer>Online Store · CS 308</footer>
</body>
</html>
