<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store</title>
  <script type="module" src="/js/home-categories.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 16px 32px; background: #1f2937; color: white; }
    header a { color: white; text-decoration: none; margin-left: 20px; }
    .logo { font-size: 22px; font-weight: bold; }
    .hero { padding: 60px 32px; background: #f3f4f6; text-align: center; }
    .categories { display: flex; gap: 24px; padding: 40px 32px; justify-content: center; }
    .category { border: 1px solid #ddd; border-radius: 8px; padding: 24px; width: 220px; text-align: center; }
    footer { padding: 16px 32px; text-align: center; color: #666; border-top: 1px solid #eee; }
    header, header nav, .categories { flex-wrap: wrap; }
    header { gap: 16px; }
    header nav { display: flex; gap: 16px; }
    header nav a { margin-left: 0; }
  </style>
  <link rel="stylesheet" href="/css/auth.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>

  <header>
    <div class="logo">Online Store</div>
    <nav>
      <a href="/">Home</a>
      <a href="/products.html" data-category-name="Phones">Phones</a>
      <a href="/products.html" data-category-name="Tablets">Tablets</a>
      <a href="#">Cart</a>
      <a id="auth-link" href="/login.html">Login</a>
      <span id="user-name" hidden></span>
      <button id="logout" type="button" hidden>Logout</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Online Store</h1>
    <p>Find the best phones and tablets at great prices.</p>
    <p><a href="/products.html">Browse products by category</a></p>
  </section>

  <section class="categories">
    <div class="category" id="phones">
      <h2>Phones</h2>
      <p>Latest smartphones</p>
      <a href="/products.html" data-category-name="Phones">Browse phones</a>
    </div>
    <div class="category" id="tablets">
      <h2>Tablets</h2>
      <p>Tablets for work and fun</p>
      <a href="/products.html" data-category-name="Tablets">Browse tablets</a>
    </div>
  </section>

  <footer>&copy; 2026 Online Store &middot; CS 308 Team</footer>
</body>
</html>
