<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 16px 32px; background: #1f2937; color: white; }
    header a { color: white; text-decoration: none; margin-left: 20px; }
    .logo { font-size: 22px; font-weight: bold; }
    .hero { padding: 60px 32px; background: #f3f4f6; text-align: center; }
    .categories { display: flex; gap: 24px; padding: 40px 32px; justify-content: center; }
    .category { border: 1px solid #ddd; border-radius: 8px; padding: 24px; width: 220px; text-align: center; }
    footer { padding: 16px 32px; text-align: center; color: #666; border-top: 1px solid #eee; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Online Store</div>
    <nav>
      <a href="#">Home</a>
      <a href="#phones">Phones</a>
      <a href="#tablets">Tablets</a>
      <a href="#">Cart</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Online Store</h1>
    <p>Find the best phones and tablets at great prices.</p>
    <p><a href="/products.html">Browse products by category</a></p>
  </section>

  <section class="categories">
    <div class="category" id="phones">
      <h2>Phones</h2>
      <p>Latest smartphones</p>
    </div>
    <div class="category" id="tablets">
      <h2>Tablets</h2>
      <p>Tablets for work and fun</p>
    </div>
  </section>

  <footer>&copy; 2026 Online Store &middot; CS 308 Team</footer>
</body>
</html>
