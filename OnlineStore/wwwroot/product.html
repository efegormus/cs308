<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/js/auth.js"></script>
  <title>Product | Online Store</title>
  <link rel="stylesheet" href="/css/products.css">
  <script type="module" src="/js/product.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to product</a>
  <header class="site-header">
    <a class="logo" href="/">Online Store</a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/products.html">Products</a>
      <a href="/checkout.html">Checkout</a>
      <a href="/deliveries.html" data-store-role="ProductManager" hidden>Deliveries</a>
      <a id="auth-link" href="/login.html">Login</a>
      <span id="user-name" hidden></span>
      <button id="logout" type="button" hidden>Logout</button>
    </nav>
  </header>
  <main id="main">
    <p><a href="/products.html">&larr; Back to all products</a></p>
    <p id="product-status" role="status" aria-live="polite">Loading product…</p>
    <button id="retry" type="button" hidden>Try again</button>
    <article id="product" class="product-detail" aria-busy="true" hidden></article>
    <noscript><p>Enable JavaScript to see the product.</p></noscript>
  </main>
  <footer>Online Store · CS 308</footer>
</body>
</html>
