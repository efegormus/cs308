<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&amp;family=Poppins:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/login.js"></script>
</head>
<body class="auth-page">
  <div class="page">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="logo" href="/">Online Store</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/products.html">Phones</a>
          <a href="/products.html">Tablets</a>
          <a href="#">Cart</a>
          <a id="auth-link" href="/login.html" aria-current="page">Login</a>
          <span id="user-name" hidden></span>
          <button id="logout" type="button" hidden>Logout</button>
        </nav>
      </div>
    </header>

    <main>
      <noscript><p>Enable JavaScript to log in.</p></noscript>
      <form id="login-form" class="card" novalidate hidden>
        <h1 class="r"><span class="ri">Log in</span></h1>
        <p class="lead r"><span class="ri">Welcome back. Log in to see your cart and your orders.</span></p>
        <div id="banner" class="banner" role="alert" hidden></div>
        <div class="stack">
          <div class="r"><div class="ri field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" aria-describedby="email-error">
            <div id="email-error" class="field-error" hidden></div>
          </div></div>
          <div class="r"><div class="ri field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" aria-describedby="password-error">
            <div id="password-error" class="field-error" hidden></div>
          </div></div>
          <div class="r"><div class="ri"><button id="submit" class="submit" type="submit">Log in</button></div></div>
        </div>
        <p class="switch r"><span class="ri">New here? <a id="register-link" href="/register.html">Create an account</a></span></p>
      </form>
    </main>

    <footer>&copy; 2026 Online Store &middot; CS 308 Team</footer>
  </div>
</body>
</html>
